<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--yellow:#E8BC35;--blue:#35556B;--bluegray:#8DA5AE;--bg:#F4F0E6;--surface:#FFFEFA;--ink:#252C32;--muted:#66747b;--line:#dcded8;--success:#47785C;--attention:#C68A27;--error:#B94C49;--shadow:0 8px 24px #252c320c}
[data-theme="dark"]{--bg:#252C32;--surface:#303A42;--ink:#F4F0E6;--muted:#b6c0c2;--line:#4b565d;--blue:#8DA5AE;--shadow:0 8px 24px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif;transition:background .2s,color .2s}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,.brand,.metric strong{font-family:"Space Grotesk",sans-serif}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:26px}.brand{font-size:29px;font-weight:700;letter-spacing:-1.6px;padding:0 12px;display:flex;align-items:center;gap:9px} .brandmark-svg{width:31px;height:31px;flex:none;color:var(--blue)}.brand-logo{display:block;width:174px;max-width:100%;height:auto;mix-blend-mode:multiply}[data-theme="dark"] .brand-logo{filter:brightness(0) invert(1);mix-blend-mode:normal}.brand{padding:0 12px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--ink)}.nav .ico{width:22px;text-align:center;font-size:17px}.side-note{margin-top:auto;padding:14px;color:var(--muted);font-size:11px;line-height:1.6;border-top:1px solid var(--line)}
main{min-width:0;padding:28px clamp(18px,3vw,44px) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 13px}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#252C32;font-weight:700}.btn.small{padding:7px 10px;font-size:12px}.page{animation:enter .18s ease-out}@keyframes enter{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
h1{font-size:clamp(27px,3vw,36px);letter-spacing:-1px;margin:0 0 6px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 24px}.ornament{color:var(--bluegray);font-family:"Space Grotesk",sans-serif;letter-spacing:3px;font-size:12px;margin:6px 0 18px}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}.card.flat{box-shadow:none}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.tiny{font-size:11px}.metric strong{font-size:28px;display:block;margin:9px 0 2px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--bluegray) 20%,transparent);font-size:11px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px}textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 13px}.heatmap{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:3px;overflow-x:auto;padding:4px 0}.heatcell{aspect-ratio:1;border-radius:2px;background:var(--line);min-width:0;width:100%;max-width:14px;justify-self:center;padding:0;border:0}.heatcell.active{background:var(--yellow)}.heatcell.l2{background:#c99d20}.heatcell.l3{background:var(--success)}.heatlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.barline{display:flex;align-items:center;gap:10px;margin:12px 0}.barline span{width:76px;font-size:12px}.bar{height:8px;border-radius:20px;background:var(--line);flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:20px}.kanban{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;overflow-x:auto}.kan-col{background:color-mix(in srgb,var(--bluegray) 13%,var(--bg));border:1px solid var(--line);border-radius:14px;padding:12px;min-height:220px}.kan-col h3{padding:7px 5px 13px}.kan-card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;cursor:pointer}.kan-card:focus{outline:2px solid var(--yellow)}.kan-card p{margin:6px 0;color:var(--muted);font-size:12px;line-height:1.45}.kan-card .due{font-size:11px;color:var(--attention)}.workgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.work{min-width:0;cursor:pointer}.cover{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 25%,var(--surface)),var(--surface));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--blue);font-family:"Space Grotesk";font-size:35px;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.cover:after{content:"♪ ♫";position:absolute;right:9px;bottom:5px;font-size:18px;letter-spacing:4px;opacity:.3}.work h3{margin:10px 0 3px;font-size:14px}.work .muted{font-size:12px}.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.tabs{display:flex;gap:5px;margin:15px 0 20px;border-bottom:1px solid var(--line)}.tabs button{background:transparent;border:0;padding:10px 13px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--ink);border-color:var(--yellow)}.bpm{font-family:"Space Grotesk";font-size:76px;font-weight:600;line-height:1}.pulse{display:flex;gap:12px;justify-content:center;padding:20px}.pulse i{width:17px;height:17px;border-radius:50%;background:var(--bluegray)}.pulse i:first-child{background:var(--yellow)}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:5}.hidden{display:none!important}.settings-panel{max-width:720px}.modal-backdrop{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:var(--surface);border-radius:16px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}.modal h2{margin-bottom:18px}
@media(max-width:1000px){.app{grid-template-columns:78px 1fr}.sidebar{padding:20px 9px}.brand{font-size:0;justify-content:center;padding:0}.nav button{justify-content:center;font-size:0}.nav .ico{font-size:18px}.side-note{display:none}.grid.four,.workgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block;padding-bottom:70px}.sidebar{position:fixed;z-index:4;bottom:0;left:0;right:0;height:65px;padding:5px 8px;border-right:0;border-top:1px solid var(--line);display:block}.brand,.side-note{display:none}.nav{display:flex;justify-content:space-around;gap:0}.nav button{display:flex;flex-direction:column;gap:2px;padding:7px 4px;font-size:9px;flex:1}.nav .ico{font-size:17px}.nav button span:last-child{font-size:9px}.nav button.active{background:transparent;color:var(--ink)}main{padding:20px 14px 30px}.topbar{margin-bottom:20px}.grid.two,.grid.three{grid-template-columns:1fr}.grid.four,.workgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kanban{grid-template-columns:repeat(3,250px)}.bpm{font-size:62px}}

.welcome-hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:22px;min-height:178px;margin:0 0 20px;padding:18px 24px;border-radius:18px;background:linear-gradient(110deg,color-mix(in srgb,var(--yellow) 13%,var(--bg)),color-mix(in srgb,var(--bluegray) 10%,var(--surface)));border:1px solid color-mix(in srgb,var(--yellow) 24%,var(--line));overflow:hidden}.welcome-copy{display:flex;align-items:flex-start;gap:18px}.sunmark{font-size:43px;line-height:1;color:var(--yellow);font-family:serif}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--muted);margin:0 0 8px}.welcome-hero h1{font-size:clamp(26px,3vw,36px);margin:0 0 8px}.welcome-hero p:not(.eyebrow){color:var(--muted);line-height:1.6;margin:0;max-width:400px}.hero-art{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--blue);min-width:0}.hero-art svg{width:min(48%,220px);height:auto;overflow:visible}.hero-quote{font-family:Georgia,serif;font-style:italic;font-size:clamp(13px,1.5vw,19px);line-height:1.4;transform:rotate(-4deg);color:var(--blue);white-space:nowrap}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.quick-card{display:flex;align-items:center;gap:11px;text-align:left;padding:15px 12px;border-radius:13px;border:1px solid var(--line);color:var(--ink);min-width:0}.quick-card b,.quick-card small{display:block}.quick-card b{font-size:12px;margin-bottom:5px}.quick-card small{font-size:10px;color:var(--muted);line-height:1.4}.quick-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}.quick-arrow{margin-left:auto;color:var(--blue);font-size:18px}.quick-gold{background:color-mix(in srgb,var(--yellow) 9%,var(--surface))}.quick-gold .quick-icon{background:color-mix(in srgb,var(--yellow) 28%,var(--surface))}.quick-blue{background:color-mix(in srgb,#57859b 8%,var(--surface))}.quick-blue .quick-icon{background:color-mix(in srgb,#57859b 22%,var(--surface))}.quick-green{background:color-mix(in srgb,#669879 9%,var(--surface))}.quick-green .quick-icon{background:color-mix(in srgb,#669879 25%,var(--surface))}.quick-lilac{background:color-mix(in srgb,#9a85b5 10%,var(--surface))}.quick-lilac .quick-icon{background:color-mix(in srgb,#9a85b5 24%,var(--surface))}.home-footer{border-top:1px solid var(--line);margin-top:22px;padding-top:14px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.home-footer em{font-family:Georgia,serif;color:var(--blue);font-size:14px}@media(max-width:900px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome-hero{grid-template-columns:1fr}.hero-art{justify-content:center}.hero-art svg{width:140px}}@media(max-width:700px){.welcome-hero{padding:16px}.welcome-copy{gap:10px}.hero-art{display:none}.quick-grid{grid-template-columns:1fr}.home-footer{flex-direction:column}.brand-logo{width:40px}.brand{font-size:0}}
</style>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pages={inicio:'Início',estudos:'Estudos',repertorio:'Repertório e Biblioteca',planejamento:'Planejamento',metronomo:'Metrônomo',config:'Configurações'};
const blank=()=>({sessions:[],exercises:[],works:[],library:[],commitments:[],settings:{theme:'light'},libraryTab:'Repertório'});
let db;try{db=JSON.parse(localStorage.getItem('allegro-db'))||blank()}catch{db=blank()}
db={...blank(),...db,settings:{...blank().settings,...(db.settings||{})}};
let page='inicio',studyTab='Visão geral',repoTab='Repertório',metro={bpm:80,running:false,beat:0,timer:null},sessionStart=null;
function save(){try{localStorage.setItem('allegro-db',JSON.stringify(db));toast('Salvo')}catch(e){toast('Não foi possível salvar. Exporta um backup e verifica o espaço disponível.')}}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return 'Sem prazo';return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}
function mins(){return db.sessions.reduce((n,s)=>n+(+s.duration||0),0)}
function activeDays(){return new Set(db.sessions.filter(s=>s.date).map(s=>s.date).concat(db.exercises.flatMap(e=>(e.logs||[]).map(l=>l.date)))).size}
function header(title,desc,action=''){return `<div class="row" style="align-items:flex-start"><div><h1>${title}</h1><p class="sub">${desc||''}</p></div>${action}</div><div class="ornament">♪ ───── ♩ ───── ♫</div>`}
function heatmap(){let dates=[];let now=new Date();for(let i=111;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);dates.push(d.toISOString().slice(0,10))}let counts={};db.sessions.forEach(s=>counts[s.date]=(counts[s.date]||0)+(+s.duration||1));db.exercises.forEach(e=>(e.logs||[]).forEach(l=>counts[l.date]=(counts[l.date]||0)+(+l.duration||1)));return `<div class="heatmap" style="grid-template-columns:repeat(28,minmax(0,1fr))">${dates.map(d=>`<button class="heatcell ${counts[d]?(counts[d]>45?'l3':counts[d]>15?'l2':'active'):''}" title="${fmtDate(d)}${counts[d]?' · atividade registada':''}" aria-label="${fmtDate(d)}" onclick="showDay('${d}')"></button>`).join('')}</div><div class="heatlabels"><span>112 dias atrás</span><span>Hoje</span></div>`}
function render(){document.documentElement.dataset.theme=db.settings.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):db.settings.theme;$('#crumb').textContent=pages[page];$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='inicio'?home():page==='estudos'?studies():page==='repertorio'?repertoire():page==='planejamento'?planning():page==='metronomo'?metronome():settings();$('#view').classList.remove('page');void $('#view').offsetWidth;$('#view').classList.add('page')}
function home(){let upcoming=db.commitments.filter(c=>c.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);return `<div class="welcome-hero"><div class="welcome-copy"><div class="sunmark">☼</div><div><p class="eyebrow">TEU ESPAÇO DE ESTUDO MUSICAL</p><h1>Olá, musicista!</h1><p>Que hoje seja mais um dia de progresso na tua jornada musical.</p></div></div><div class="hero-art"><div class="hero-quote">Que as notas surjam claras<br>Sinceras, buenas e puras<br>Na ilusão das partituras<br>Para os solos das guitarras.</div><svg viewBox="0 0 220 170" role="img" aria-label="Ilustração de violão e notas musicais"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M130 15 C115 32 117 50 130 63 C142 75 153 89 144 108 C137 123 120 122 112 111 C103 98 108 82 119 71 C132 58 139 48 130 15Z"/><path d="M130 15 L146 3 L154 10 L143 25 M143 25 L154 10 M119 71 L145 108 M126 66 L139 100 M116 83 L133 112"/><circle cx="128" cy="91" r="13"/><path d="M128 78V31 M124 78V31 M132 78V31"/><path d="M20 55h33m-33 8h33m-33 8h20"/><path d="M173 45v24m0-24l15-5v21"/><ellipse cx="169" cy="71" rx="4" ry="3" fill="currentColor"/><ellipse cx="184" cy="64" rx="4" ry="3" fill="currentColor"/><path d="M42 120 C82 145 131 146 202 111" stroke="var(--yellow)" stroke-width="2.5"/></g><g fill="currentColor"><text x="63" y="42" font-size="20">♪</text><text x="186" y="91" font-size="18">♫</text></g></svg></div></div><div class="grid three"><div class="card metric"><span class="muted">Tempo registrado</span><strong>${Math.floor(mins()/60)}h ${mins()%60}m</strong><span class="tiny muted">Soma das sessões</span></div><div class="card metric"><span class="muted">Dias ativos</span><strong>${activeDays()}</strong><span class="tiny muted">Dias com registros</span></div><div class="card metric"><span class="muted">Obras no repertório</span><strong>${db.works.length}</strong><span class="tiny muted">Obras cadastradas</span></div></div><div class="section-head"><h2>Constância</h2><span class="pill">16 semanas · 112 dias</span></div><div class="card">${heatmap()}<p class="tiny muted">Cada quadrado representa um dia. A intensidade é ilustrativa do volume registrado.</p></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="row"><h2>Atividade recente</h2><button class="btn small" onclick="go('estudos')">Ver estudos</button></div>${db.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(s=>`<div class="barline"><span>${esc(s.focus||'Estudo')}</span><div class="bar"><i style="width:${Math.min(100,(+s.duration||0)/90*100)}%"></i></div><b>${+s.duration||0}m</b></div>`).join('')||'<div class="empty">Teus registros de estudo aparecerão aqui.</div>'}</div><div class="card"><div class="row"><h2>Próximos compromissos</h2><button class="btn small" onclick="go('planejamento')">Abrir quadro</button></div>${upcoming.map(c=>`<div class="barline"><span style="width:auto;flex:1">${esc(c.title)}</span><span>${fmtDate(c.due)}</span></div>`).join('')||'<div class="empty">Nenhum prazo cadastrado.</div>'}</div></div><div class="section-head"><h2>Pequenos passos, grandes melodias</h2><span class="pill">♪ um dia de cada vez</span></div><div class="quick-grid"><button class="quick-card quick-gold" onclick="go('estudos');sessionForm()"><span class="quick-icon">♬</span><span><b>Registrar estudo</b><small>Anota tua prática de hoje</small></span><span class="quick-arrow">↗</span></button><button class="quick-card quick-blue" onclick="go('repertorio');workForm()"><span class="quick-icon">♫</span><span><b>Adicionar obra</b><small>Alimenta teu repertório</small></span><span class="quick-arrow">↗</span></button><button class="quick-card quick-green" onclick="go('planejamento');commitmentForm()"><span class="quick-icon">✳</span><span><b>Planejar</b><small>Organiza teus próximos passos</small></span><span class="quick-arrow">↗</span></button><button class="quick-card quick-lilac" onclick="go('metronomo')"><span class="quick-icon">♟</span><span><b>Abrir metrônomo</b><small>Encontra teu pulso</small></span><span class="quick-arrow">↗</span></button></div><div class="home-footer"><span>♪ Música · Estudo · Constância · Liberdade</span><em>E para os solos de guitarras<br>As minhas reflexões.</em></div>`}
function studies(){return `${header('Estudos','E a guitarra lhe entendia, como a ouvir-lhe o coração.','<button class="btn primary" onclick="sessionForm()">＋ Registrar estudo</button>')}<div class="tabs">${['Visão geral','Sessões','Rotina técnica','Histórico'].map(t=>`<button class="${studyTab===t?'active':''}" onclick="studyTab='${t}';render()">${t}</button>`).join('')}</div>${studyTab==='Visão geral'?`<div class="grid two"><div class="card metric"><span class="muted">Tempo estudado</span><strong>${Math.floor(mins()/60)}h ${mins()%60}m</strong><span class="tiny muted">Todos os registros</span></div><div class="card metric"><span class="muted">Dias ativos</span><strong>${activeDays()}</strong><span class="tiny muted">Histórico total</span></div></div><div class="section-head"><h2>Constância · violão</h2></div><div class="card">${heatmap()}</div><div class="section-head"><h2>Atalhos</h2></div><div class="actions"><button class="btn primary" onclick="sessionForm()">Registrar estudo</button><button class="btn" onclick="studyTab='Rotina técnica';render()">Abrir rotina técnica</button></div>`:studyTab==='Rotina técnica'?`<div class="row"><h2>Exercícios</h2><button class="btn primary" onclick="exerciseForm()">＋ Novo exercício</button></div><div class="grid two">${db.exercises.map((e,i)=>`<div class="card"><div class="row"><h3>${esc(e.name)}</h3><span class="pill">${esc(e.category||'Técnica')}</span></div><p class="muted">${esc(e.description||'')}</p><div class="row"><span class="tiny muted">Último BPM</span><strong>${(e.logs||[]).slice(-1)[0]?.bpm||'—'}</strong></div><div class="actions" style="margin-top:12px"><button class="btn small primary" onclick="exerciseLog(${i})">Registrar prática</button><button class="btn small" onclick="exerciseDetails(${i})">Histórico</button></div></div>`).join('')||'<div class="empty">Adiciona teus exercícios técnicos para começar.</div>'}</div>`:`<div class="card">${db.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((s,i)=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(s.content||s.focus||'Sessão de estudo')}</b><div class="tiny muted">${fmtDate(s.date)} · ${esc(s.focus||'')}</div></div><div class="actions"><span class="pill">${s.duration||0} min</span><button class="btn small" onclick="editSession(${db.sessions.indexOf(s)})">Editar</button><button class="btn small" onclick="deleteSession(${db.sessions.indexOf(s)})">×</button></div></div>`).join('')||'<div class="empty">Ainda não há sessões registradas.</div>'}</div>`}`}
function sessionForm(idx=null){let s=idx===null?{}:db.sessions[idx];modal(`<h2>${idx===null?'Registrar estudo':'Editar sessão'}</h2><form id="sessionForm"><div class="grid two"><div class="field"><label>Data</label><input name="date" type="date" value="${s.date||today()}" required></div><div class="field"><label>Duração (minutos)</label><input name="duration" type="number" min="0" value="${s.duration||30}" required></div></div><div class="field"><label>Foco</label><select name="focus">${['Técnica','Repertório','Composição/arranjo','Teoria/percepção','Estudo livre'].map(x=>`<option ${s.focus===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Conteúdo</label><input name="content" value="${esc(s.content||'')}" placeholder="Ex.: arpejos, introdução da obra..."></div><div class="grid two"><div class="field"><label>BPM (opcional)</label><input name="bpm" type="number" min="1" max="400" value="${s.bpm||''}"></div><div class="field"><label>Como foi?</label><select name="difficulty"><option value="">Não informar</option>${['Leve','Moderada','Difícil'].map(x=>`<option ${s.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Observações</label><textarea name="notes">${esc(s.notes||'')}</textarea></div><div class="actions"><button class="btn primary" type="submit">Salvar sessão</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);$('#sessionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.duration=+o.duration;o.bpm=o.bpm?+o.bpm:null;if(idx===null)db.sessions.push(o);else db.sessions[idx]=o;save();closeModal();render()}}
function editSession(i){sessionForm(i)}function deleteSession(i){if(confirm('Excluir esta sessão?')){db.sessions.splice(i,1);save();render()}}
function exerciseForm(){modal(`<h2>Novo exercício</h2><form id="exForm"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Categoria</label><input name="category" placeholder="Ex.: mão direita, sincronização"></div><div class="field"><label>Descrição</label><textarea name="description"></textarea></div><div class="actions"><button class="btn primary">Criar exercício</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div></form>`);$('#exForm').onsubmit=e=>{e.preventDefault();db.exercises.push({...Object.fromEntries(new FormData(e.target)),logs:[]});save();closeModal();render()}}
function exerciseLog(i){let e=db.exercises[i];modal(`<h2>Registrar prática · ${esc(e.name)}</h2><form id="logForm"><div class="grid two"><div class="field"><label>Data</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>BPM</label><input type="number" name="bpm" min="1" max="400"></div></div><div class="field"><label>Tempo dedicado (min)</label><input type="number" name="duration" min="0" value="10"></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn primary">Salvar prática</button></form>`);$('#logForm').onsubmit=ev=>{ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target));o.bpm=+o.bpm||null;o.duration=+o.duration||0;e.logs.push(o);save();closeModal();render()}}
function exerciseDetails(i){let e=db.exercises[i];modal(`<h2>${esc(e.name)}</h2><p class="muted">${esc(e.category||'Técnica')}</p><div class="card flat"><h3>Histórico de BPM</h3>${(e.logs||[]).map(l=>`<div class="row" style="padding:8px 0"><span>${fmtDate(l.date)}</span><b>${l.bpm||'—'} BPM</b></div>`).join('')||'<p class="muted">Sem práticas registradas.</p>'}</div>`)}
function newRepoItem(){if(repoTab==='Repertório')workForm();else libraryForm()}
function repertoire(){return `${header('Repertório e Biblioteca','Obras, materiais e referências.','<button class="btn primary" onclick="newRepoItem()">＋ Novo item</button>')}<div class="tabs">${['Repertório','Biblioteca'].map(t=>`<button class="${repoTab===t?'active':''}" onclick="repoTab='${t}';render()">${t}</button>`).join('')}</div>${repoTab==='Repertório'?`<div class="row" style="margin-bottom:18px"><input id="workSearch" placeholder="Buscar obra ou compositor..." oninput="filterWorks()" style="max-width:320px"><select id="workStatus" onchange="filterWorks()" style="max-width:180px"><option value="">Todos os estados</option>${['Quero aprender','Em estudo','Em revisão','Pronta'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="workgrid" id="workgrid">${workCards(db.works)}</div>`:`<div class="row" style="margin-bottom:18px"><input id="libSearch" placeholder="Buscar materiais, tags e categorias..." oninput="filterLibrary()" style="max-width:360px"><select id="libCat" onchange="filterLibrary()" style="max-width:190px"><option value="">Todas as categorias</option>${['Teoria musical','Percepção','Materiais','Referências'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="grid two" id="libgrid">${libraryCards(db.library)}</div>`}`}
function workCards(works){return works.map((w,i)=>`<article class="work" onclick="workDetails(${db.works.indexOf(w)})"><div class="cover">${w.image?`<img src="${esc(w.image)}" alt="">`:esc((w.title||'♪').slice(0,1))}</div><h3>${esc(w.title)}</h3><div class="muted">${esc(w.composer||'Compositor não informado')}</div><div class="tiny muted" style="margin-top:7px">${esc(w.status||'Quero aprender')}</div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">Teu repertório começa com a primeira obra cadastrada.</div>'}
function filterWorks(){let q=($('#workSearch')?.value||'').toLowerCase(),st=$('#workStatus')?.value||'';$('#workgrid').innerHTML=workCards(db.works.filter(w=>(w.title+' '+w.composer).toLowerCase().includes(q)&&(!st||w.status===st)))}
function workForm(idx=null){let w=idx===null?{}:db.works[idx];modal(`<h2>${idx===null?'Adicionar obra':'Editar obra'}</h2><form id="workForm"><div class="field"><label>Título</label><input name="title" value="${esc(w.title||'')}" required></div><div class="field"><label>Compositor</label><input name="composer" value="${esc(w.composer||'')}"></div><div class="grid two"><div class="field"><label>Ritmo/gênero</label><input name="genre" value="${esc(w.genre||'')}"></div><div class="field"><label>Dificuldade</label><select name="difficulty">${['Não definida','Fácil','Moderada','Difícil','Muito difícil'].map(x=>`<option ${w.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Estado</label><select name="status">${['Quero aprender','Em estudo','Em revisão','Pronta'].map(x=>`<option ${w.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Imagem de capa (URL)</label><input name="image" value="${esc(w.image||'')}" placeholder="https://..."></div><div class="field"><label>Notas e técnicas</label><textarea name="notes">${esc(w.notes||'')}</textarea></div><div class="field"><label>Links de referência (um por linha)</label><textarea name="links">${esc((w.links||[]).join('\\n'))}</textarea></div><div class="actions"><button class="btn primary">Salvar obra</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div></form>`);$('#workForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.links=o.links.split('\\n').map(x=>x.trim()).filter(Boolean);if(idx===null)db.works.push(o);else db.works[idx]=o;save();closeModal();render()}}
function workDetails(i){let w=db.works[i];modal(`<div class="row"><h2>${esc(w.title)}</h2><button class="btn small" onclick="closeModal()">✕</button></div><p class="muted">${esc(w.composer||'')} · ${esc(w.genre||'')}</p><p>${esc(w.notes||'Sem notas adicionadas.')}</p><p><span class="pill">${esc(w.status||'Quero aprender')}</span> <span class="pill">${esc(w.difficulty||'Não definida')}</span></p><h3>Referências</h3>${(w.links||[]).map(l=>`<p><a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a></p>`).join('')||'<p class="muted">Nenhum link cadastrado.</p>'}<div class="actions"><button class="btn primary" onclick="workForm(${i})">Editar obra</button><button class="btn" onclick="commitmentForm(null,${i})">Planejar esta obra</button><button class="btn" onclick="if(confirm('Excluir obra?')){db.works.splice(${i},1);save();closeModal();render()}">Excluir</button></div>`)}
function libraryForm(){modal(`<h2>Novo item da biblioteca</h2><form id="libForm"><div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Categoria</label><select name="category">${['Teoria musical','Percepção','Materiais','Referências'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Descrição e tags</label><textarea name="description"></textarea></div><div class="field"><label>Links (um por linha)</label><textarea name="links"></textarea></div><button class="btn primary">Salvar item</button></form>`);$('#libForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.links=o.links.split('\\n').map(x=>x.trim()).filter(Boolean);db.library.push(o);save();closeModal();render()}}
function libraryCards(items){return items.map((x,i)=>`<div class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="pill">${esc(x.category)}</span></div><p class="muted">${esc(x.description||'')}</p>${(x.links||[]).map(l=>`<p><a target="_blank" rel="noopener" href="${esc(l)}">${esc(l)}</a></p>`).join('')}</div>`).join('')||'<div class="empty">Nenhum material cadastrado.</div>'}
function filterLibrary(){let q=($('#libSearch')?.value||'').toLowerCase(),cat=$('#libCat')?.value||'';$('#libgrid').innerHTML=libraryCards(db.library.filter(x=>(x.title+' '+x.description+' '+x.category).toLowerCase().includes(q)&&(!cat||x.category===cat)))}
function planning(){let cols=['A tirar','Em processo/arranjo','Pronta pra tocar'];return `${header('Planejamento','Obras, pessoas e compromissos em preparação.','<button class="btn primary" onclick="commitmentForm()">＋ Novo compromisso</button>')}<div class="grid two" style="margin-bottom:16px"><div class="field"><label>Pessoa/intérprete</label><select id="personFilter" onchange="filterBoard()"><option value="">Todas as pessoas</option>${[...new Set(db.commitments.map(c=>c.person).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Evento</label><select id="eventFilter" onchange="filterBoard()"><option value="">Todos os eventos</option>${[...new Set(db.commitments.map(c=>c.event).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="field" style="max-width:260px"><label>Prazo</label><select id="dueFilter" onchange="filterBoard()"><option value="">Todos os prazos</option><option value="upcoming">Próximos 30 dias</option><option value="overdue">Atrasados</option></select></div><div class="kanban" id="board">${boardColumns(cols)}</div>`}
function boardColumns(cols){return cols.map(col=>`<div class="kan-col" data-col="${col}"><h3>${col}</h3>${db.commitments.filter(c=>(c.stage||cols[0])===col&&matchesFilter(c)).map(c=>`<article class="kan-card" draggable="true" tabindex="0" onclick="commitmentDetails(${db.commitments.indexOf(c)})" onkeydown="if(event.key==='Enter')commitmentDetails(${db.commitments.indexOf(c)})" ondragstart="event.dataTransfer.setData('text/plain','${db.commitments.indexOf(c)}')"><b>${esc(c.title)}</b><p>${esc(c.person||'Pessoa não definida')} · ${esc(c.event||'Evento não definido')}</p>${c.description?`<p>${esc(c.description)}</p>`:''}<div class="due">${fmtDate(c.due)}</div></article>`).join('')||'<div class="empty tiny">Arrasta uma obra para cá ou adiciona um compromisso.</div>'}</div>`).join('')}
function matchesFilter(c){let p=$('#personFilter')?.value||'',e=$('#eventFilter')?.value||'',d=$('#dueFilter')?.value||'';if(p&&c.person!==p||e&&c.event!==e)return false;if(d==='overdue'&&(!c.due||c.due>=today()||(c.stage==='Pronta pra tocar')))return false;if(d==='upcoming'&&(!c.due||c.due<today()||c.due>new Date(Date.now()+30*86400000).toISOString().slice(0,10)))return false;return true}
function filterBoard(){let cols=['A tirar','Em processo/arranjo','Pronta pra tocar'];$('#board').innerHTML=boardColumns(cols);bindDrops()}
function bindDrops(){$$('.kan-col').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.style.outline='2px dashed var(--yellow)'};el.ondragleave=()=>el.style.outline='';el.ondrop=e=>{e.preventDefault();el.style.outline='';let i=+e.dataTransfer.getData('text/plain');if(db.commitments[i]){db.commitments[i].stage=el.dataset.col;save();filterBoard()}}})}
function commitmentForm(idx=null,workIndex=null){let c=idx===null?{}:db.commitments[idx];modal(`<h2>${idx===null?'Novo compromisso':'Editar compromisso'}</h2><form id="commitForm"><div class="field"><label>Obra</label><select name="workIndex"><option value="">Cadastrar título manualmente</option>${db.works.map((w,i)=>`<option value="${i}" ${(workIndex===i||c.workIndex===i)?'selected':''}>${esc(w.title)} · ${esc(w.composer||'')}</option>`).join('')}</select></div><div class="field"><label>Nome da música</label><input name="title" value="${esc(c.title|| (workIndex!==null?db.works[workIndex]?.title:''))}" placeholder="Título da obra" required></div><div class="grid two"><div class="field"><label>Pessoa/intérprete</label><input name="person" value="${esc(c.person||'')}"></div><div class="field"><label>Evento</label><input name="event" value="${esc(c.event||'')}"></div></div><div class="grid two"><div class="field"><label>Prazo</label><input type="date" name="due" value="${c.due||''}"></div><div class="field"><label>Etapa</label><select name="stage">${['A tirar','Em processo/arranjo','Pronta pra tocar'].map(x=>`<option ${(c.stage||'A tirar')===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Descrição musical</label><textarea name="description" placeholder="Ex.: Tom: Em · Violão solo; preparar introdução...">${esc(c.description||'')}</textarea></div><div class="actions"><button class="btn primary">Salvar compromisso</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);$('#commitForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.workIndex=o.workIndex===''?null:+o.workIndex;if(o.workIndex!==null&&db.works[o.workIndex])o.title=db.works[o.workIndex].title;if(idx===null)db.commitments.push(o);else db.commitments[idx]=o;save();closeModal();render()}}
function commitmentDetails(i){let c=db.commitments[i];modal(`<h2>${esc(c.title)}</h2><p class="muted">${esc(c.person||'')} · ${esc(c.event||'')}</p><p>${esc(c.description||'Sem descrição musical.')}</p><p><span class="pill">${esc(c.stage||'A tirar')}</span> Prazo: ${fmtDate(c.due)}</p><div class="actions"><button class="btn primary" onclick="commitmentForm(${i})">Editar</button><button class="btn" onclick="if(confirm('Excluir compromisso?')){db.commitments.splice(${i},1);save();closeModal();render()}">Excluir</button></div>`)}
const tempos=[[40,'Largo'],[60,'Larghetto'],[66,'Adagio'],[76,'Andante'],[108,'Moderato'],[120,'Allegro'],[168,'Presto'],[200,'Prestissimo']];
function tempoName(b){let n='Prestissimo';for(let [v,s] of tempos)if(b<v){n=s;break}return n}
function metronome(){return `${header('Metrônomo','Um pulso claro para estudar com intenção.')}<div class="card" style="max-width:720px;margin:auto;text-align:center;padding:clamp(22px,5vw,48px)"><div class="ornament">${tempoName(metro.bpm).toUpperCase()} · ♪ ─ ♩ ─ ♫</div><div class="bpm" id="bpm">${metro.bpm}</div><div class="muted" style="margin-bottom:20px">BPM</div><div class="actions" style="justify-content:center"><button class="btn" onclick="setBpm(metro.bpm-5)">−5</button><button class="btn" onclick="setBpm(metro.bpm-1)">−1</button><button class="btn" onclick="setBpm(metro.bpm+1)">+1</button><button class="btn" onclick="setBpm(metro.bpm+5)">+5</button></div><div style="max-width:400px;margin:20px auto"><input type="range" min="30" max="240" value="${metro.bpm}" oninput="setBpm(+this.value)" aria-label="Ajustar BPM"><div class="field"><label>Andamento exato</label><input type="number" min="30" max="240" value="${metro.bpm}" onchange="setBpm(+this.value)"></div></div><div class="pulse" id="pulse"><i></i><i></i><i></i><i></i></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="toggleMetro()" id="metroToggle">${metro.running?'Parar':'▶ Iniciar'}</button><button class="btn" onclick="tapTempo()">Tap tempo</button></div><div class="grid two" style="text-align:left;margin-top:25px"><div class="field"><label>Compasso</label><select id="meter"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option><option>5/4</option><option>7/8</option></select></div><div class="field"><label>Subdivisão</label><select id="subdivision"><option>Semínimas</option><option>Colcheias</option><option>Tercinas</option><option>Semicolcheias</option></select></div></div><div class="field" style="text-align:left"><label>Volume do clique</label><input id="volume" type="range" min="0" max="100" value="65"></div><p class="tiny muted">O metrônomo usa áudio do navegador. A precisão depende do dispositivo e do navegador.</p></div>`}
let audioCtx=null,tapTimes=[];
function setBpm(v){metro.bpm=Math.max(30,Math.min(240,Math.round(v||80)));if(page==='metronomo')render()}
function toggleMetro(){if(metro.running){clearInterval(metro.timer);metro.running=false;render();return}metro.running=true;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();metro.beat=0;const tick=()=>{let n=+$('meter')?.value?.split('/')[0]||4;let freq=metro.beat%n===0?1100:750;let vol=(+($('#volume')?.value||65))/100*.12;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.04);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.045);let p=$$('#pulse i');p.forEach((x,i)=>x.style.transform=i===metro.beat%n?'scale(1.35)':'scale(1)');p.forEach((x,i)=>x.style.background=i===metro.beat%n?'var(--yellow)':'var(--bluegray)');metro.beat++};tick();metro.timer=setInterval(tick,60000/metro.bpm);render()}
function tapTempo(){let n=Date.now();tapTimes.push(n);tapTimes=tapTimes.filter(t=>n-t<5000).slice(-6);if(tapTimes.length>=2){let gaps=tapTimes.slice(1).map((t,i)=>t-tapTimes[i]);setBpm(60000/(gaps.reduce((a,b)=>a+b,0)/gaps.length))}}
function settings(){return `${header('Configurações','Personaliza o allegro e protege teus registros.')}<div class="settings-panel grid"><div class="card"><h2>Aparência</h2><div class="field"><label>Tema</label><select id="themeSelect"><option value="light" ${db.settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${db.settings.theme==='dark'?'selected':''}>Escuro</option><option value="auto" ${db.settings.theme==='auto'?'selected':''}>Automático (sistema)</option></select></div><p class="tiny muted">A paleta azul, amarela e grafite permanece consistente nos dois temas.</p></div><div class="card"><h2>Backup e restauração</h2><p class="muted">Exporta teus registros para um arquivo JSON. Guarda-o num local seguro; os dados ficam neste navegador.</p><div class="actions"><button class="btn primary" onclick="exportBackup()">↓ Exportar backup</button><button class="btn" onclick="$('#importFile').click()">↑ Restaurar backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this.files[0])"></div></div><div class="card"><h2>Armazenamento</h2><p class="muted">Os registros são salvos automaticamente neste navegador. Limpar os dados do navegador pode apagá-los. O GitHub Pages hospeda a interface, não sincroniza os dados entre dispositivos.</p><span class="pill">Salvamento local ativo</span></div></div>`}
function exportBackup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'allegro'},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='allegro-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado')}
function importBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;let n=blank();['sessions','exercises','works','library','commitments'].forEach(k=>n[k]=Array.isArray(x[k])?x[k]:[]);n.settings={...n.settings,...x.settings};db=n;save();render();toast('Backup restaurado')}catch{toast('Arquivo de backup inválido')} };r.readAsText(file)}
function modal(content){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function showDay(d){let a=db.sessions.filter(s=>s.date===d),b=db.exercises.flatMap(e=>(e.logs||[]).filter(l=>l.date===d).map(l=>({name:e.name,...l})));modal(`<h2>Atividade · ${fmtDate(d)}</h2>${a.map(s=>`<p><b>${esc(s.content||s.focus||'Sessão')}</b> · ${s.duration||0} min</p>`).join('')}${b.map(x=>`<p><b>${esc(x.name)}</b> · ${x.bpm||'—'} BPM · ${x.duration||0} min</p>`).join('')||(!a.length?'<p class="muted">Nenhuma atividade registrada neste dia.</p>':'')}<button class="btn" onclick="closeModal()">Fechar</button>`)}
function go(p){if(metro.running&&p!=='metronomo'){clearInterval(metro.timer);metro.running=false}page=p;render();if(page==='planejamento')bindDrops()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
$('#settingsShortcut').onclick=()=>go('config');
document.addEventListener('change',e=>{if(e.target.id==='themeSelect'){db.settings.theme=e.target.value;save();render()}});
try{render()}catch(err){console.error(err);$('#view').innerHTML='<div class="card"><h2>O allegro encontrou um erro</h2><p>Atualiza a página e tenta novamente. Se persistir, abre o console do navegador para ver os detalhes.</p></div>'}
</script>
</body>
</html>
